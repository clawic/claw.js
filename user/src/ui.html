<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User</title>
<link rel="icon" href="data:,">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

:root, [data-theme="dark"] {
  --bg: #111116;
  --surface: #1a1a22;
  --surface2: #22222d;
  --border: #2a2a38;
  --text: #e8e8f0;
  --text2: #8888a0;
  --text3: #4a4a60;
  --accent: #6366f1;
  --accent2: #a78bfa;
  --teal: #2dd4bf;
  --amber: #fbbf24;
  --rose: #fb7185;
  --green: #34d399;
  --radius: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Space Grotesk', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
#app { position: relative; height: 100vh; }
#graph-canvas {
  position: absolute;
  inset: 0;
  z-index: 0;
}
#graph-canvas svg { width: 100%; height: 100%; display: block; }

/* command bar */
.command-bar {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px 8px;
  box-shadow: var(--shadow);
}
.command-bar select, .command-bar input {
  background: var(--surface2);
  border: 1px solid var(--border);
  outline: 0;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border-radius: 9px;
  min-width: 220px;
  cursor: pointer;
}
.command-bar select:hover { border-color: var(--accent); }
.command-bar .label {
  font-size: 11px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 0 4px;
}
.command-bar .btn {
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.command-bar .btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.command-bar .btn:hover { filter: brightness(1.1); }

/* detail panel */
.detail-panel {
  position: absolute;
  top: 80px;
  right: 20px;
  bottom: 20px;
  width: 460px;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.detail-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.detail-header .title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.detail-header .sub {
  font-size: 12px;
  color: var(--text3);
  margin-top: 4px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}
.detail-header .pill-row {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.pill {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(99,102,241,0.12);
  color: var(--accent2);
  border: 1px solid rgba(99,102,241,0.2);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}
.pill.muted { background: var(--surface2); color: var(--text3); border-color: var(--border); }
.pill.warn { background: rgba(251,113,133,0.12); color: var(--rose); border-color: rgba(251,113,133,0.25); }
.pill.ok { background: rgba(45,212,191,0.12); color: var(--teal); border-color: rgba(45,212,191,0.25); }

.detail-body { flex: 1; overflow-y: auto; padding: 10px 14px 16px; }
.detail-empty {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 13px;
  text-align: center;
  padding: 40px 20px;
}
.detail-empty .btn {
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 8px 16px;
  font-family: inherit;
  cursor: pointer;
}

.row-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 10px 0;
  overflow: hidden;
}
.row-card .rc-head {
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: rgba(99,102,241,0.06);
}
.row-card .rc-head .rc-source {
  font-size: 10px;
  font-weight: 600;
  color: var(--accent2);
  letter-spacing: .06em;
  text-transform: uppercase;
}
.row-card .rc-head .rc-table {
  font-size: 11px;
  color: var(--text3);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}
.row-card .rc-body { padding: 10px 12px; }
.kv {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 4px 12px;
  font-size: 12px;
}
.kv .k {
  color: var(--text3);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.kv .v {
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  word-break: break-word;
}
.kv .v input, .kv .v textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
  font-family: inherit;
  font-size: 12px;
}
.actions {
  margin-top: 10px;
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}
.btn-sm {
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.btn-sm.danger { background: var(--rose); }
.btn-sm.secondary { background: var(--surface); color: var(--text2); border: 1px solid var(--border); }
.btn-sm:hover { filter: brightness(1.1); }

.section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin: 14px 4px 6px;
}

/* toast */
#toast {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 12px;
  box-shadow: var(--shadow);
  z-index: 50;
  opacity: 0;
  transition: opacity .2s ease;
  pointer-events: none;
}
#toast.show { opacity: 1; }
#toast.error { border-color: var(--rose); color: var(--rose); }

.node-circle { cursor: pointer; }
.node-label {
  font-size: 11px;
  pointer-events: none;
  fill: var(--text);
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 3;
  stroke-linejoin: round;
}
.legend {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: var(--text2);
  box-shadow: var(--shadow);
}
.legend .legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend .swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
</style>
</head>
<body data-theme="dark">
<div id="app">
  <div id="graph-canvas"></div>

  <div class="command-bar">
    <span class="label">User</span>
    <select id="user-select"><option>Loading…</option></select>
    <button class="btn" id="seed-btn" title="Insert synthetic test-user-001 across all sources">Seed test-user-001</button>
    <button class="btn secondary" id="refresh-btn" title="Reload sources">↻</button>
  </div>

  <div class="detail-panel">
    <div class="detail-header">
      <div class="title" id="detail-title">No user selected</div>
      <div class="sub" id="detail-sub">Pick a user from the dropdown.</div>
      <div class="pill-row" id="detail-pills"></div>
    </div>
    <div class="detail-body" id="detail-body">
      <div class="detail-empty">
        <div>No user selected.</div>
        <div>Pick one from the dropdown above, or generate the synthetic <code>test-user-001</code> seed.</div>
        <button class="btn" id="seed-empty-btn">Seed test-user-001</button>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="swatch" style="background:var(--accent)"></span> user</div>
    <div class="legend-item"><span class="swatch" style="background:var(--teal)"></span> source</div>
    <div class="legend-item"><span class="swatch" style="background:var(--amber)"></span> table</div>
    <div class="legend-item"><span class="swatch" style="background:var(--rose)"></span> row / linked entity</div>
  </div>

  <div id="toast"></div>
</div>

<script>
const state = {
  users: [],
  selectedUserId: null,
  bundle: null,
  graph: null,
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function toast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("error", Boolean(isError));
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2800);
}

function escapeHtml(value) {
  if (value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function loadUsers(preserveSelection = true) {
  const data = await api("/api/users");
  state.users = data.users;
  const select = document.getElementById("user-select");
  const previous = preserveSelection ? state.selectedUserId : null;
  select.innerHTML = "";
  if (state.users.length === 0) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "(no users discovered)";
    select.appendChild(opt);
    state.selectedUserId = null;
  } else {
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "— select a user —";
    select.appendChild(placeholder);
    for (const user of state.users) {
      const opt = document.createElement("option");
      opt.value = user.id;
      opt.textContent = `${user.label}  (${user.sources.join(", ")})`;
      select.appendChild(opt);
    }
    if (previous && state.users.some((u) => u.id === previous)) {
      select.value = previous;
    }
  }
}

async function selectUser(userId) {
  state.selectedUserId = userId;
  if (!userId) {
    state.bundle = null;
    state.graph = { nodes: [], edges: [] };
    renderDetail();
    renderGraph();
    return;
  }
  document.getElementById("detail-body").innerHTML = `<div class="detail-empty">Loading…</div>`;
  try {
    const [bundle, graph] = await Promise.all([
      api(`/api/users/${encodeURIComponent(userId)}`),
      api(`/api/graph?userId=${encodeURIComponent(userId)}`),
    ]);
    state.bundle = bundle;
    state.graph = graph;
    renderDetail();
    renderGraph();
  } catch (err) {
    toast(err.message, true);
  }
}

function renderDetail() {
  const titleEl = document.getElementById("detail-title");
  const subEl = document.getElementById("detail-sub");
  const pillsEl = document.getElementById("detail-pills");
  const bodyEl = document.getElementById("detail-body");
  if (!state.bundle) {
    titleEl.textContent = "No user selected";
    subEl.textContent = "Pick a user from the dropdown.";
    pillsEl.innerHTML = "";
    bodyEl.innerHTML = `
      <div class="detail-empty">
        <div>No user selected.</div>
        <div>Pick one from the dropdown above, or generate the synthetic <code>test-user-001</code> seed.</div>
        <button class="btn" id="seed-empty-btn">Seed test-user-001</button>
      </div>
    `;
    document.getElementById("seed-empty-btn").onclick = () => runSeed();
    return;
  }
  const { identity, rows } = state.bundle;
  titleEl.textContent = identity.label;
  subEl.textContent = identity.email ? `${identity.email}  ·  ${identity.id}` : identity.id;
  const sources = [...new Set(rows.map((r) => r.source))];
  const tables = [...new Set(rows.map((r) => `${r.source}/${r.table}`))];
  pillsEl.innerHTML = [
    `<span class="pill ok">${rows.length} rows</span>`,
    `<span class="pill">${sources.length} sources</span>`,
    `<span class="pill">${tables.length} tables</span>`,
  ].join("");
  if (rows.length === 0) {
    bodyEl.innerHTML = `<div class="detail-empty">No associated data found for this user.</div>`;
    return;
  }
  bodyEl.innerHTML = rows.map((r, idx) => renderRowCard(r, idx)).join("");
  attachRowHandlers();
}

function renderRowCard(row, idx) {
  const writable = isWritable(row);
  const deletable = isDeletable(row);
  const fields = Object.entries(row.row)
    .filter(([k]) => k !== "__pk" && k !== "password_hash" && k !== "token_hash")
    .map(([k, v]) => {
      const editable = writable.includes(k);
      const display = v === null || v === undefined ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v));
      const safe = escapeHtml(display);
      const input = editable
        ? `<input data-row-idx="${idx}" data-field="${k}" value="${safe.replace(/"/g, '&quot;')}" />`
        : `<span>${safe}</span>`;
      return `<div class="k">${escapeHtml(k)}</div><div class="v">${input}</div>`;
    }).join("");
  const actions = (writable.length > 0 || deletable)
    ? `<div class="actions">
         ${writable.length > 0 ? `<button class="btn-sm" data-action="save" data-row-idx="${idx}">Save</button>` : ""}
         ${deletable ? `<button class="btn-sm danger" data-action="delete" data-row-idx="${idx}">Delete</button>` : ""}
       </div>`
    : "";
  return `
    <div class="row-card" data-row-idx="${idx}">
      <div class="rc-head">
        <span class="rc-source">${escapeHtml(row.source)}</span>
        <span class="rc-table">${escapeHtml(row.table)} · pk=${escapeHtml(row.primaryKey)}</span>
      </div>
      <div class="rc-body">
        <div class="kv">${fields}</div>
        ${actions}
      </div>
    </div>
  `;
}

function attachRowHandlers() {
  for (const btn of document.querySelectorAll("[data-action]")) {
    btn.onclick = async () => {
      const idx = Number(btn.getAttribute("data-row-idx"));
      const row = state.bundle.rows[idx];
      const action = btn.getAttribute("data-action");
      try {
        if (action === "save") {
          const writable = isWritable(row);
          const updates = {};
          for (const input of document.querySelectorAll(`input[data-row-idx="${idx}"]`)) {
            const field = input.getAttribute("data-field");
            if (writable.includes(field)) updates[field] = input.value;
          }
          if (row.source === "memory" && row.table === "entities/person") {
            await api("/api/memory/person", { method: "PATCH", body: { id: row.primaryKey, frontmatter: updates } });
          } else if (row.source === "telegram") {
            await api("/api/telegram/account", { method: "PATCH", body: { accountId: row.primaryKey, updates } });
          } else {
            await api("/api/row", {
              method: "PATCH",
              body: { source: row.source, table: row.table, primaryKey: row.primaryKey, updates },
            });
          }
          toast("Saved");
          await selectUser(state.selectedUserId);
        } else if (action === "delete") {
          if (!confirm(`Delete from ${row.source}/${row.table}?`)) return;
          await api("/api/row", {
            method: "DELETE",
            body: { source: row.source, table: row.table, primaryKey: row.primaryKey },
          });
          toast("Deleted");
          await selectUser(state.selectedUserId);
        }
      } catch (err) {
        toast(err.message, true);
      }
    };
  }
}

const WRITABLE = {
  "relay/users": ["email", "role"],
  "relay/memberships": ["scopes_json"],
  "relay/devices": ["label", "platform"],
  "execution-plane/users": ["email"],
  "execution-plane/memberships": ["scopes_json", "role"],
  "execution-plane/projects": ["name", "description"],
  "notify/device_installations": ["device_name", "platform"],
  "notify/user_preferences": ["critical_only", "quiet_hours_json"],
  "content/entries": ["title", "summary", "status"],
  "erp/employees": ["display_name", "employee_number"],
};
const DELETABLE = new Set([
  "relay/refresh_tokens",
  "notify/device_installations",
  "notify/subscriptions",
]);
function isWritable(row) {
  if (row.source === "memory" && row.table === "entities/person") {
    return ["title", "role", "timezone"];
  }
  if (row.source === "telegram") {
    return ["label"];
  }
  return WRITABLE[`${row.source}/${row.table}`] || [];
}
function isDeletable(row) {
  return DELETABLE.has(`${row.source}/${row.table}`);
}

// ---------- D3 graph ----------

const COLOR = {
  user: "#6366f1",
  source: "#2dd4bf",
  table: "#fbbf24",
  row: "#fb7185",
};
const RADIUS = { user: 22, source: 16, table: 11, row: 7 };

function renderGraph() {
  const container = document.getElementById("graph-canvas");
  container.innerHTML = "";
  if (!state.graph || state.graph.nodes.length === 0) {
    return;
  }
  const width = container.clientWidth;
  const height = container.clientHeight;

  const nodes = state.graph.nodes.map((n) => ({ ...n }));
  const links = state.graph.edges.map((e) => ({ ...e }));

  const svg = d3.select(container).append("svg").attr("viewBox", [0, 0, width, height]);
  const g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.2, 3]).on("zoom", (event) => g.attr("transform", event.transform)));

  const userNode = nodes.find((n) => n.kind === "user");
  if (userNode) {
    userNode.fx = width / 2;
    userNode.fy = height / 2;
  }

  const linkDistance = (d) => {
    const a = d.source.kind || "row";
    const b = d.target.kind || "row";
    if (a === "user" || b === "user") return 130;
    if (a === "source" || b === "source") return 95;
    return 60;
  };

  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance(linkDistance).strength(0.5))
    .force("charge", d3.forceManyBody().strength((d) => d.kind === "user" ? -1200 : d.kind === "source" ? -350 : -120))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius((d) => (RADIUS[d.kind] || 7) + 6));

  const link = g.append("g")
    .attr("stroke", "rgba(255,255,255,0.08)")
    .selectAll("line")
    .data(links)
    .join("line")
    .attr("stroke-width", (d) => (d.relation === "in" ? 2 : 1));

  const node = g.append("g")
    .selectAll("g")
    .data(nodes)
    .join("g")
    .attr("class", "node-circle")
    .call(drag(simulation))
    .on("click", (_event, d) => {
      if (d.kind === "user") return;
      const id = d.id;
      const card = document.querySelector(`.row-card[data-row-source="${d.sourceId}"][data-row-table="${d.tableId}"]`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.style.outline = "2px solid var(--accent)";
        setTimeout(() => (card.style.outline = ""), 1200);
      }
    });

  node.append("circle")
    .attr("r", (d) => RADIUS[d.kind] || 7)
    .attr("fill", (d) => COLOR[d.kind] || COLOR.row)
    .attr("fill-opacity", 0.92)
    .attr("stroke", "var(--bg)")
    .attr("stroke-width", 2);

  node.append("text")
    .attr("class", "node-label")
    .attr("dy", (d) => (RADIUS[d.kind] || 7) + 13)
    .attr("text-anchor", "middle")
    .text((d) => {
      const max = d.kind === "user" ? 26 : d.kind === "source" ? 18 : 14;
      const label = d.label || d.id;
      return label.length > max ? label.slice(0, max - 1) + "…" : label;
    });

  simulation.on("tick", () => {
    link
      .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
      .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
    node.attr("transform", (d) => `translate(${d.x},${d.y})`);
  });
}

function drag(simulation) {
  return d3.drag()
    .on("start", (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on("end", (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      if (d.kind !== "user") { d.fx = null; d.fy = null; }
    });
}

// ---------- seed ----------

async function runSeed(userId = "test-user-001") {
  if (!confirm(`Seed synthetic data for ${userId} across all available sources?`)) return;
  try {
    toast("Seeding…");
    const result = await api("/api/seed", { method: "POST", body: { userId } });
    const ok = result.reports.filter((r) => r.status === "ok");
    const errors = result.reports.filter((r) => r.status === "error");
    toast(`Seed: ${ok.length} ok, ${errors.length} errors`, errors.length > 0);
    await loadUsers(false);
    document.getElementById("user-select").value = userId;
    await selectUser(userId);
  } catch (err) {
    toast(err.message, true);
  }
}

// ---------- bootstrap ----------

document.getElementById("user-select").addEventListener("change", (e) => {
  selectUser(e.target.value || null);
});
document.getElementById("seed-btn").onclick = () => runSeed();
document.getElementById("refresh-btn").onclick = async () => {
  await api("/api/sources/refresh", { method: "POST" });
  await loadUsers();
  if (state.selectedUserId) await selectUser(state.selectedUserId);
};

(async () => {
  try {
    await loadUsers(false);
    const hashId = decodeURIComponent((window.location.hash || "").replace(/^#/, ""));
    if (hashId && state.users.some((u) => u.id === hashId)) {
      document.getElementById("user-select").value = hashId;
      await selectUser(hashId);
    }
  } catch (err) {
    toast(err.message, true);
  }
})();
</script>
</body>
</html>
