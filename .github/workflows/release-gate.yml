name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - next
      - "release/**"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run publish:dry-run
